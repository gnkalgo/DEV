worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream gnkalgo_api {
        server backend:8000;
    }

    upstream gnkalgo_web {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost gnkalgo.com app.gnkalgo.com api.gnkalgo.com;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Request-ID $request_id always;

        location /api/ {
            proxy_pass http://gnkalgo_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location = /health {
            proxy_pass http://gnkalgo_api/health;
            proxy_set_header Host $host;
        }

        location = /ready {
            proxy_pass http://gnkalgo_api/ready;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://gnkalgo_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
        }
    }
}
